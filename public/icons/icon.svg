<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- App Background with soft rounded corner for splash icon -->
  <rect width="512" height="512" rx="128" fill="url(#medGrad)" />
  
  <!-- Pill emblem -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#shadow)">
    <!-- Pill body -->
    <rect x="140" y="196" width="232" height="120" rx="60" fill="#ffffff" />
    <!-- Left capsule half -->
    <path d="M 200 196 A 60 60 0 0 0 200 316 L 256 316 L 256 196 Z" fill="#38bdf8" />
    <!-- Center divider -->
    <line x1="256" y1="196" x2="256" y2="316" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Medical cross accent -->
  <g transform="translate(360, 150) scale(0.9)">
    <circle cx="0" cy="0" r="38" fill="#10b981" />
    <rect x="-6" y="-22" width="12" height="44" rx="4" fill="#ffffff" />
    <rect x="-22" y="-6" width="44" height="12" rx="4" fill="#ffffff" />
  </g>
</svg>
